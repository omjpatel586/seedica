name: Deploy

# Deploys to the app server over SSH: pull -> install -> next build -> pm2 restart.
#
# Required GitHub *Secrets*  (Settings -> Secrets and variables -> Actions -> Secrets)
#   SSH_PRIVATE_KEY : full contents of the .pem file, including the
#                     "-----BEGIN ... KEY-----" / "-----END ... KEY-----" lines
#   SERVER_IP       : server IP or hostname
#   SSH_USER        : SSH login user (on a Hostinger VPS this is usually "root")
#
# Required GitHub *Variables* (same page -> Variables tab)
#   APP_DIR         : ABSOLUTE path to the repo on the server.
#                     Note "~/seedica/seedica" or "seedica/seedica" will NOT work;
#                     for the root user it is normally /root/seedica/seedica
#   PM2_APP_NAME    : pm2 process name, as shown by `pm2 list`, e.g. seedica
#
# Optional Variables
#   SSH_PORT        : defaults to 22
#   NODE_ENV        : defaults to production

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never let two deploys touch the server at once; queue instead of cancelling
# so an in-flight build is not killed halfway through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and restart on server
    runs-on: ubuntu-latest
    # The build runs on the server, so the runner only needs an SSH client.

    steps:
      - name: Verify required secrets and variables are set
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          APP_DIR: ${{ vars.APP_DIR }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
        run: |
          missing=()
          [ -n "$SSH_PRIVATE_KEY" ] || missing+=("secrets.SSH_PRIVATE_KEY")
          [ -n "$SERVER_IP" ]       || missing+=("secrets.SERVER_IP")
          [ -n "$SSH_USER" ]        || missing+=("secrets.SSH_USER")
          [ -n "$APP_DIR" ]         || missing+=("vars.APP_DIR")
          [ -n "$PM2_APP_NAME" ]    || missing+=("vars.PM2_APP_NAME")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required configuration: ${missing[*]}"
            exit 1
          fi
          # A tilde, a relative path or a stray space in a GitHub Variable all
          # surface later as a confusing "cd: No such file or directory",
          # so reject them here where the message can name the cause.
          case "$APP_DIR" in
            "~"*)
              echo "::error::vars.APP_DIR must not start with '~' (it is not expanded). Use the full path, e.g. /root/seedica/seedica"
              exit 1 ;;
            /*) ;;
            *)
              echo "::error::vars.APP_DIR must be an absolute path starting with '/', got '$APP_DIR'"
              exit 1 ;;
          esac
          case "$APP_DIR" in
            *[[:space:]]*)
              echo "::error::vars.APP_DIR contains whitespace: '$APP_DIR'"
              exit 1 ;;
          esac
          echo "All required configuration is present."

      - name: Configure SSH key and known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Strip CR so a pem pasted from Windows is still a valid key, and
          # guarantee the trailing newline OpenSSH requires.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          if ! ssh-keygen -y -f ~/.ssh/deploy.pem > /dev/null 2>&1; then
            echo "::error::secrets.SSH_PRIVATE_KEY is not a valid private key. Paste the whole .pem including the BEGIN/END lines."
            exit 1
          fi
          # Pin the host key rather than disabling StrictHostKeyChecking.
          ssh-keyscan -p "$SSH_PORT" -H "$SERVER_IP" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          APP_DIR: ${{ vars.APP_DIR }}
          PM2_APP_NAME: ${{ vars.PM2_APP_NAME }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
        run: |
          # The heredoc is quoted so $VARS inside are expanded on the SERVER,
          # not by the runner. Config is passed positionally instead.
          ssh -i ~/.ssh/deploy.pem \
              -p "$SSH_PORT" \
              -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              "$SSH_USER@$SERVER_IP" \
              bash -s -- "$APP_DIR" "$PM2_APP_NAME" "$DEPLOY_BRANCH" "$NODE_ENV" <<'REMOTE'
          # Not using `set -u`: nvm.sh trips over unset variables when sourced.
          set -eo pipefail

          APP_DIR="$1"
          PM2_APP_NAME="$2"
          DEPLOY_BRANCH="$3"
          export NODE_ENV="$4"

          echo "==> Environment"
          echo "    whoami  : $(whoami)"
          echo "    HOME    : $HOME"
          echo "    APP_DIR : $APP_DIR"

          # ---------------------------------------------------------------
          # Locate the checkout BEFORE anything else, and if it is missing,
          # print enough to identify the real path in a single run.
          # ---------------------------------------------------------------
          if [ ! -d "$APP_DIR" ]; then
            echo
            echo "ERROR: APP_DIR '$APP_DIR' does not exist on this server."
            echo
            echo "--- contents of / ---"
            ls -1 / 2>/dev/null
            echo
            echo "--- contents of \$HOME ($HOME) ---"
            ls -la "$HOME" 2>/dev/null
            parent="$(dirname "$APP_DIR")"
            if [ -d "$parent" ]; then
              echo
              echo "--- contents of $parent ---"
              ls -la "$parent"
            else
              echo
              echo "(parent directory '$parent' does not exist either)"
            fi
            echo
            echo "--- git checkouts found on this server ---"
            find /root /home /var/www /srv /opt /seedica -maxdepth 4 -type d -name .git \
              2>/dev/null | sed 's|/\.git$||' | head -20
            echo
            echo "Set the GitHub Variable APP_DIR to one of the paths listed above."
            exit 1
          fi

          cd "$APP_DIR"

          if [ ! -d .git ]; then
            echo "ERROR: '$APP_DIR' exists but is not a git repository (no .git directory)."
            echo "Contents:"
            ls -la
            exit 1
          fi

          # ---------------------------------------------------------------
          # Toolchain discovery.
          #
          # `ssh host bash -s` gets a NON-interactive, NON-login shell, so
          # /etc/profile, ~/.bashrc and ~/.profile are all skipped and nvm is
          # never initialised. Because npm/npx/pm2 are node scripts starting
          # with `#!/usr/bin/env node`, a missing node makes them fail with
          # "/usr/bin/env: 'node': No such file or directory" -- which reads
          # like a missing path rather than a missing runtime. Resolve it here.
          # ---------------------------------------------------------------
          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh" > /dev/null 2>&1 || true
            # `nvm` is a shell function and only exists after sourcing.
            command -v nvm > /dev/null 2>&1 && nvm use --silent default > /dev/null 2>&1 || true
          fi

          # Prepend plausible locations, including nvm's versioned bin dirs and
          # the usual nodesource / Hostinger paths.
          for d in /usr/bin /usr/local/bin /opt/nodejs/bin "$NVM_DIR"/versions/node/*/bin; do
            [ -d "$d" ] && PATH="$d:$PATH"
          done
          export PATH

          echo "==> Toolchain"
          toolchain_ok=1
          for bin in git node npm pm2; do
            if command -v "$bin" > /dev/null 2>&1; then
              printf '    %-5s : %s (%s)\n' "$bin" "$(command -v "$bin")" "$("$bin" --version 2>&1 | head -1)"
            else
              echo "    $bin : NOT FOUND"
              toolchain_ok=0
            fi
          done
          if [ "$toolchain_ok" -ne 1 ]; then
            echo
            echo "ERROR: commands above are missing from this non-interactive SSH session."
            echo "Searched PATH: $PATH"
            echo "Run 'command -v node npm pm2' on the server over a normal login to"
            echo "find their real paths, then add that directory to the PATH loop in"
            echo ".github/workflows/deploy.yml."
            exit 1
          fi

          echo "==> Pulling $DEPLOY_BRANCH"
          git fetch origin "$DEPLOY_BRANCH"
          # Force the working tree to match the remote. Any uncommitted edits
          # made directly on the server are DISCARDED.
          git reset --hard "origin/$DEPLOY_BRANCH"
          echo "    now at $(git rev-parse --short HEAD): $(git log -1 --pretty=%s)"

          echo "==> Installing dependencies"
          # The build needs devDependencies (next, typescript, tailwind), which
          # npm would skip under NODE_ENV=production, so ask for them.
          if [ -f package-lock.json ]; then
            npm ci --include=dev
          else
            npm install --include=dev
          fi

          echo "==> Building Next.js app"
          npm run build

          echo "==> Restarting pm2 process '$PM2_APP_NAME'"
          if pm2 describe "$PM2_APP_NAME" > /dev/null 2>&1; then
            pm2 restart "$PM2_APP_NAME" --update-env
          else
            echo "    process not found; starting it for the first time"
            pm2 start npm --name "$PM2_APP_NAME" -- start
          fi

          # Persist the process list so the app survives a server reboot.
          pm2 save > /dev/null

          echo "==> Deploy complete"
          pm2 list
          REMOTE

      - name: Remove SSH key from runner
        if: always()
        run: rm -f ~/.ssh/deploy.pem
